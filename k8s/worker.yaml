apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf-worker-sa
  namespace: pdf
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WORKER_IRSA_ROLE_ARN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-worker
  namespace: pdf
spec:
  replicas: 2
  selector:
    matchLabels: { app: pdf-worker }
  template:
    metadata:
      labels: { app: pdf-worker }
    spec:
      serviceAccountName: pdf-worker-sa
      containers:
        - name: worker
          image: REPLACE_ECR_WORKER_IMAGE:latest
          env:
            - { name: AWS_REGION, value: ap-south-1 }
            - { name: QUEUE_URL, value: REPLACE_WORK_QUEUE_URL }
            - { name: JOBS_TABLE, value: PdfJobs }
            - { name: ITEMS_TABLE, value: PdfJobItems }
            - { name: SNS_TOPIC_ARN, value: REPLACE_SNS_TOPIC_ARN }
            - { name: VISIBILITY_TIMEOUT_SEC, value: "180" }
            - { name: HEARTBEAT_EVERY_SEC, value: "45" }
            - { name: EXIFTOOL_TIMEOUT_MS, value: "60000" }
            - { name: QPDF_TIMEOUT_MS, value: "60000" }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
